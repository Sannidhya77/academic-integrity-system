<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AIMS{% endblock %} · Academic Integrity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
{% block head_extra %}{% endblock %}
</head>
<body class="app-body">
<div class="app-shell">
<aside class="app-sidebar" aria-label="Main navigation">
<a class="app-sidebar-brand" href="{{ url_for('dashboard') }}">
<i class="bi bi-shield-check"></i>
<span>AIMS</span>
</a>
<nav class="app-nav">
<a class="app-nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">
<i class="bi bi-grid-1x2-fill"></i>
Dashboard
</a>
<a class="app-nav-link" href="{{ url_for('dashboard') }}#upload">
<i class="bi bi-cloud-arrow-up-fill"></i>
Upload
</a>
<a class="app-nav-link {% if request.endpoint == 'results' %}active{% endif %}" href="{{ url_for('results') }}">
<i class="bi bi-graph-up-arrow"></i>
Results
</a>
<a class="app-nav-link {% if request.endpoint == 'history' %}active{% endif %}" href="{{ url_for('history') }}">
<i class="bi bi-clock-history"></i>
History
</a>
</nav>
<div class="app-sidebar-footer">
Academic Integrity Monitoring — heuristic similarity &amp; AI signals.
</div>
</aside>
<main class="app-main">
<div class="d-lg-none mb-3">
<button type="button" class="btn btn-sm btn-app-outline" aria-label="Open navigation" onclick="document.querySelector('.app-sidebar').classList.toggle('is-open')">
<i class="bi bi-list"></i> Menu
</button>
</div>
{% block content %}{% endblock %}
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
